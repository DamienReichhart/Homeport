[package]
name = "homeport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Homeport desktop application"

[lib]
name = "homeport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
chacha20poly1305 = "0.10"
getrandom = "0.3"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
gethostname = "1"
tar = "0.4"
shell-words = "1"

[dev-dependencies]
tempfile = "3"

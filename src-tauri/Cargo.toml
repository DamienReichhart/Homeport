[package]
name = "homeport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Homeport desktop application"
publish = false

[lints]
workspace = true

[lib]
name = "homeport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

# The app shell only wires the crates below to Tauri; their own
# dependencies (bollard, russh, SQLite…) stay theirs.
[dependencies]
homeport-core.workspace = true
homeport-storage.workspace = true
homeport-transport.workspace = true
homeport-engine.workspace = true
homeport-containerd.workspace = true
homeport-incus.workspace = true
homeport-hosts.workspace = true
homeport-clusters.workspace = true
homeport-kubernetes.workspace = true
homeport-nomad.workspace = true
homeport-stacks.workspace = true
homeport-git.workspace = true
homeport-registries.workspace = true
homeport-backup.workspace = true
homeport-settings.workspace = true
homeport-updates.workspace = true
homeport-diagnostics.workspace = true
zip.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-notification.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The sample databases of released versions, for tests/upgrade.rs.
homeport-storage = { workspace = true, features = ["test-support"] }

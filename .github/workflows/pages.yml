name: Pages

# Builds the website (website/) and the package repositories (ADR 0003), and
# deploys them to GitHub Pages.
# - Pull requests that touch it: build only, as a check (types, links, pages).
# - Pushes to main that touch it: build and deploy.
# - After every successful Release run: rebuild, so the download page,
#   changelog, APT and RPM repositories and update manifest list the new version. (A release published with GITHUB_TOKEN
#   doesn't trigger `release` events, so this listens for the workflow instead.)
on:
  push:
    branches: [main]
    paths: &paths
      - website/**
      - assets/brand/**
      - packaging/linux/**
      - scripts/repositories*.ts
      - .github/workflows/pages.yml
  pull_request:
    paths: *paths
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time and never cancelled halfway; pull requests only
# cancel their own older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The origin and base path of the Pages site, so a custom domain needs no code change.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Read the releases with the workflow's token (higher rate limit), and fail
          # rather than deploy a download page without files if they can't be read.
          GITHUB_TOKEN: ${{ github.token }}
          RELEASES_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '' }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c
      # Deploys sign with the package key (packaging/linux/homeport.asc). Pull
      # requests get no secrets, so they sign with a throwaway key to check the build.
      - name: Import the package signing key
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          [ -n "$KEY" ] || { echo "::error::PACKAGES_GPG_PRIVATE_KEY is not set: run scripts/setup-signing.sh"; exit 1; }
          install -d -m 700 ~/.gnupg
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf 'pinentry-mode loopback\npassphrase-file %s\n' "$RUNNER_TEMP/passphrase" >> ~/.gnupg/gpg.conf
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "PUBLIC_KEY=packaging/linux/homeport.asc" >> "$GITHUB_ENV"
      - name: Create a throwaway signing key
        if: github.event_name == 'pull_request'
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'Homeport pull request check <noreply@example.invalid>' rsa3072 sign 1d
          gpg --armor --export > "$RUNNER_TEMP/throwaway.asc"
          echo "PUBLIC_KEY=$RUNNER_TEMP/throwaway.asc" >> "$GITHUB_ENV"
      - name: Build the package repositories
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/repositories.ts --out website/dist --public-key "$PUBLIC_KEY"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

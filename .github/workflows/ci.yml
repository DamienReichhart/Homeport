name: CI

on:
  push:
    branches: [dev] # main runs these checks inside the Release workflow
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels a CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # Release builds generate the notices; catch an unaccepted license before then.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: bun run licenses

  # Every platform Homeport ships for, so code behind #[cfg(windows)] or
  # #[cfg(target_os = "macos")] is compiled and tested on each pull request.
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false # finish the other platforms, so one failure doesn't hide another
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.os }}
      - run: bun run build # tauri::generate_context! needs ../dist
      # Formatting doesn't depend on the platform.
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # every_release_has_a_fixture compares the release tags with the
      # database fixtures; a checkout has no tags.
      - run: git fetch --tags --depth=1 origin
        if: runner.os == 'Linux'
      - run: cargo test --workspace

  # The real app (Rust backend, real webview, real IPC) driven through
  # tauri-driver and WebKitWebDriver against the runner's Docker Engine:
  # e2e/specs. Linux only; macOS has no WebDriver for its webview. The app
  # is a debug build with the frontend embedded, as releases have it, so a
  # command missing from commands::builder(), a permission missing from
  # src-tauri/capabilities/ or a style the CSP blocks fails here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Tauri, WebDriver, display and keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      # Ubuntu's AppArmor stops unprivileged user namespaces, which WebKit's
      # web process sandbox uses: allow them on this throwaway runner.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-driver@2.1.0
      # The licence notices (cargo-about) are the licenses job's: build without them.
      - run: bun tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":"bun run build"}}'
      - run: docker pull mirror.gcr.io/library/alpine:3.22 && docker pull mirror.gcr.io/library/busybox:1.37
      - run: bun install --frozen-lockfile && bun run typecheck
        working-directory: e2e
      - run: ./run.sh
        working-directory: e2e
      - name: Keep the screenshots and the app's log of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

  # The tests marked #[ignore = "needs a local Docker Engine…"] against the
  # runner's own Engine and compose plugin. The shell crate has none, so it is
  # left out and no Tauri system dependencies are needed.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-tests
      - name: Show the Engine and compose versions
        run: |
          docker version
          docker compose version
      # Pulling up front keeps the first tests' timing stable.
      - run: docker pull alpine:3.22
      # The helper image that opens volumes (ADR 0015).
      - run: docker pull busybox:1.37
      # containerd's and Incus's sockets are root's; the jobs below run those tests.
      - run: cargo test --workspace --exclude homeport -- --ignored --skip containerd_live --skip incus_live --skip nomad_live
      - name: Check that the tests cleaned up after themselves
        if: always()
        run: scripts/ci/engine-test-leftovers.sh

  # The tests marked #[ignore = "needs a local containerd"] against the
  # containerd under the runner's Docker Engine (ADR 0020). Its socket is
  # root's, so the test binaries run with sudo; they work in their own
  # homeport-test namespace and pull from mirror.gcr.io, without Docker
  # Hub's limits. Pulling through Transfer needs containerd 2.0 and skips
  # itself on an older one.
  containerd-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: containerd-tests
      - name: Show containerd's version
        run: sudo ctr version
      - run: cargo test -p homeport-containerd -p homeport-hosts -- --ignored containerd_live
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
      - name: Check that the tests cleaned up after themselves
        if: always()
        run: |
          left=$(sudo ctr --namespace homeport-test containers ls -q)
          if [ -n "$left" ]; then echo "containers left behind: $left"; exit 1; fi

  # The tests marked #[ignore = "needs a local Incus"] against an Incus
  # installed on the runner from Ubuntu's archive (ADR 0021). Its socket is
  # the incus-admin group's, so the test binaries run with sudo; they make
  # small Alpine containers from images.linuxcontainers.org, a custom volume,
  # a bridge and a profile, and remove them. HTTPS listens on loopback for
  # the trust token test.
  incus-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: incus-tests
      - name: Install and start Incus
        run: |
          sudo apt-get update
          sudo apt-get install -y incus
          sudo incus admin init --minimal
          sudo incus config set core.https_address 127.0.0.1:8443
          sudo incus version
      - run: cargo test -p homeport-incus -p homeport-hosts -- --ignored incus_live
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
      - name: Check that the tests cleaned up after themselves
        if: always()
        run: |
          left=$(sudo incus list --format csv --columns n | grep homeport- || true)
          if [ -n "$left" ]; then echo "instances left behind: $left"; exit 1; fi

  # The Nomad live tests talk to a Nomad dev agent (nomad agent -dev), from
  # HashiCorp's APT repository, through its HTTP API only, as the app does.
  # The agent runs as root so the docker driver can run the tests' jobs.
  nomad-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nomad-tests
      - name: Install and start a Nomad dev agent
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y nomad
          sudo nomad agent -dev -bind 127.0.0.1 > "$RUNNER_TEMP/nomad.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4646/v1/status/leader | grep -q : && break
            sleep 1
          done
          nomad version
      - run: cargo test -p homeport-nomad -- --ignored nomad_live
      - name: Show the agent's log
        if: failure()
        run: cat "$RUNNER_TEMP/nomad.log"

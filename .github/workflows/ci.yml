name: CI

on:
  push:
    branches: [dev] # main runs these checks inside the Release workflow
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels a CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # Release builds generate the notices; catch an unaccepted license before then.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: bun run licenses

  # Every platform Homeport ships for, so code behind #[cfg(windows)] or
  # #[cfg(target_os = "macos")] is compiled and tested on each pull request.
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false # finish the other platforms, so one failure doesn't hide another
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.os }}
      - run: bun run build # tauri::generate_context! needs ../dist
      # Formatting doesn't depend on the platform.
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The tests marked #[ignore = "needs a local Docker Engine…"] against the
  # runner's own Engine and compose plugin. The shell crate has none, so it is
  # left out and no Tauri system dependencies are needed.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-tests
      - name: Show the Engine and compose versions
        run: |
          docker version
          docker compose version
      # Pulling up front keeps the first tests' timing stable.
      - run: docker pull alpine:3.22
      # The helper image that opens volumes (ADR 0015).
      - run: docker pull busybox:1.37
      - run: cargo test --workspace --exclude homeport -- --ignored
      - name: Check that the tests cleaned up after themselves
        if: always()
        run: scripts/ci/engine-test-leftovers.sh

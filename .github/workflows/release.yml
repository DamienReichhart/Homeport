name: Release

# Every push to main releases the version set in the repo files
# (tauri.conf.json, package.json, Cargo.toml, Cargo.lock). The run fails at once
# if they disagree or that version was already released: bump it to release again.
# Each platform builds natively while CI runs; the release is published only
# once CI and every build succeeded.
on:
  push:
    branches: [main]
  workflow_dispatch: # retry a failed release without pushing

# One release at a time, never cancelled halfway; a newer push waits its turn.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, and the history since the previous release for the notes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: plan
        run: bun scripts/release.ts plan --notes "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 7
      - name: Summary
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          { echo "# Releasing $TAG"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false # finish the other platforms, so only the failed one needs a re-run
      matrix:
        include:
          # Ubuntu 22.04's glibc 2.35 keeps the Linux builds running on older distributions.
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # Cross-compiled; WiX can't build ARM64 MSIs.
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          # Signs each installer for the in-app updater; the app only installs
          # updates signed with this key (tauri.conf.json > plugins > updater).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs the .rpm with the package repositories' key (packaging/linux/homeport.asc).
          TAURI_SIGNING_RPM_KEY: ${{ runner.os == 'Linux' && secrets.PACKAGES_GPG_PRIVATE_KEY || '' }}
          TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ runner.os == 'Linux' && secrets.PACKAGES_GPG_PASSPHRASE || '' }}
          # macOS signing and notarization, used when the secrets are set. Without
          # them the app is ad-hoc signed (tauri.conf.json > bundle > macOS).
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Tauri treats a set-but-empty variable as configured, so drop the unset secrets.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            TAURI_SIGNING_RPM_KEY TAURI_SIGNING_RPM_KEY_PASSPHRASE TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ "$RUNNER_OS" = Linux ] && [ -z "$TAURI_SIGNING_RPM_KEY" ]; then
            echo "::error::PACKAGES_GPG_PRIVATE_KEY is not set: run scripts/setup-signing.sh"; exit 1
          fi
          # WiX only takes numeric prerelease identifiers, so prereleases ship no MSI.
          [ "$PRERELEASE" = true ] && BUNDLES="${BUNDLES/msi,/}"
          # Updater files only in release builds, so local builds need no signing key.
          bun tauri build --ci --target "$TARGET" --bundles "$BUNDLES" \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect the installers
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bundle="target/$TARGET/release/bundle"
          shopt -s nullglob
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage \
            "$bundle"/msi/*.msi "$bundle"/nsis/*-setup.exe "$bundle"/dmg/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No installers in $bundle"; exit 1; }
          mkdir -p installers
          cp "${files[@]}" installers/
          # The updater's signature of each installer it can apply.
          for file in "${files[@]}"; do
            [ ! -f "$file.sig" ] || cp "$file.sig" installers/
          done
          # macOS updates from the zipped app, named the same for both architectures: name it like the .dmg.
          app="$bundle/macos/Homeport.app.tar.gz"
          if [ -f "$app" ]; then
            [[ "$TARGET" == aarch64-* ]] && arch=aarch64 || arch=x64
            cp "$app" "installers/Homeport_${VERSION}_${arch}.app.tar.gz"
            cp "$app.sig" "installers/Homeport_${VERSION}_${arch}.app.tar.gz.sig"
          fi
          ls -l installers
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: installers/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # installers are already compressed

  publish:
    needs: [ci, prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Checksums
        working-directory: installers
        run: sha256sum -- * | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: installers/*
      - name: Publish
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease --latest=false)
          # Creates the tag on the commit that was built, and publishes once every file is uploaded.
          gh release create "$TAG" installers/* "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title "Homeport $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "Published [$TAG]($(gh release view "$TAG" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"

  # winget, Scoop and the AUR (issues #6, #7 and #8) live outside GitHub
  # Pages. Their files are rendered from the published checksums and always
  # kept as an artifact; each channel is updated only once its secret is set
  # (docs/RELEASING.md).
  channels:
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Render the winget and Scoop manifests and the AUR package
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          bun scripts/channels.ts --version "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS.txt" --out "$RUNNER_TEMP/channels"
      - uses: actions/upload-artifact@v7
        with:
          name: channels
          path: ${{ runner.temp }}/channels
          include-hidden-files: true # .SRCINFO
          retention-days: 30
      - name: Update the Scoop bucket
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET: DamienReichhart/scoop-bucket
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN isn't set; skipping the Scoop bucket."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$BUCKET.git" "$RUNNER_TEMP/bucket"
          cd "$RUNNER_TEMP/bucket"
          mkdir -p bucket
          cp "$RUNNER_TEMP/channels/scoop/homeport.json" bucket/homeport.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/homeport.json
          git diff --cached --quiet && { echo "Already at $VERSION."; exit 0; }
          git commit -m "homeport: update to $VERSION"
          git push
      - name: Update the AUR package
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY isn't set; skipping the AUR."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/homeport-bin.git "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          cp "$RUNNER_TEMP/channels/aur/PKGBUILD" "$RUNNER_TEMP/channels/aur/.SRCINFO" .
          git config user.name "Homeport release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "Already at $VERSION."; exit 0; }
          git commit -m "Update to $VERSION"
          git push origin HEAD:master

  # winget takes a pull request to microsoft/winget-pkgs, which wingetcreate
  # (Windows only) opens from the rendered manifests with a token that may
  # fork that repository.
  winget:
    needs: [prepare, channels]
    if: needs.prepare.outputs.prerelease != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: channels
          path: channels
      - name: Submit the manifests to winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::WINGET_TOKEN isn't set; skipping winget."
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN `
            --prtitle "New version: DamienReichhart.Homeport version $env:VERSION" channels/winget

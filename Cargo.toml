[workspace]
members = ["src-tauri", "crates/*/*"]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

# Lints every crate opts into with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

# One version of each dependency for the whole workspace; crates opt in with
# `name.workspace = true` and add the features they need.
[workspace.dependencies]
# Async runtime and I/O.
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Serialization and the TypeScript contract.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
# Errors and logging.
thiserror = "2"
log = "0.4"
# The Engine API and how Homeport reaches it.
bollard = "0.21"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The Kubernetes API of a Cluster, on rustls and ring like the rest of the
# app. k8s-openapi's `earliest` schema (1.33) reads older Clusters' stable
# resources too. `ws` opens the websockets of exec, attach and port-forwards.
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "http-proxy", "oidc", "ws"] }
http = "1"
# Exec credential plugins' expiry timestamps (RFC 3339), as kube-rs reads them.
jiff = "0.2"
# The secret strings kube's AuthInfo holds credentials in.
secrecy = "0.10"
k8s-openapi = { version = "0.29", default-features = false, features = ["std", "earliest"] }
# containerd's gRPC API (ADR 0020): HTTP/2 over the Host's dialer, with code
# generated at build time from the vendored .proto files by the vendored protoc.
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
protoc-bin-vendored = "3"
prost = "0.14"
prost-types = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
# Incus's websockets (events, console, exec; ADR 0021) over the Host's dialer,
# and the client certificate an Incus Host trusts Homeport by.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# HTTP from this machine (registry logins, Docker Hub), on the same rustls
# and ring as the rest of the app.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "system-proxy"] }
# The CAs this computer trusts, for a Nomad agent whose certificate a public
# or company CA signed; reqwest verifies with it too.
rustls-platform-verifier = "0.7"
# Storage and secrets.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
chacha20poly1305 = "0.10"
# Deriving the key of a passphrase-protected export (ADR 0013).
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.3"
keyring = "4"
# Fingerprints of a Linked Stack's compose files (ADR 0008).
sha2 = "0.10"
# The Basic authorisation header of a git repository's token (ADR 0014).
base64 = "0.22"
# Small utilities.
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
tar = "0.4"
# The diagnostics bundle: redaction rules, and the archive itself.
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
shell-words = "1"
tempfile = "3"
# The desktop shell.
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Homeport's own crates, by layer under crates/, from the bottom of the
# dependency graph up (docs/ARCHITECTURE.md).
# Foundation: errors and the Host model, storage, reaching a Host.
homeport-core = { path = "crates/foundation/core" }
homeport-storage = { path = "crates/foundation/storage" }
homeport-transport = { path = "crates/foundation/transport" }
# Runtimes: the API of each thing Homeport manages.
homeport-engine = { path = "crates/runtimes/engine" }
homeport-containerd = { path = "crates/runtimes/containerd" }
homeport-incus = { path = "crates/runtimes/incus" }
homeport-nomad = { path = "crates/runtimes/nomad" }
homeport-kubernetes = { path = "crates/runtimes/kubernetes" }
# Domains: what Homeport keeps, and the use cases on it.
homeport-hosts = { path = "crates/domains/hosts" }
homeport-clusters = { path = "crates/domains/clusters" }
homeport-git = { path = "crates/domains/git" }
homeport-stacks = { path = "crates/domains/stacks" }
homeport-registries = { path = "crates/domains/registries" }
homeport-settings = { path = "crates/domains/settings" }
# The app: what it does across domains.
homeport-diagnostics = { path = "crates/app/diagnostics" }
homeport-backup = { path = "crates/app/backup" }
homeport-updates = { path = "crates/app/updates" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Deriving an export's key takes seconds unoptimised; keep debug builds and
# tests close to release speed there.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

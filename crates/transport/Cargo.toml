[package]
name = "homeport-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "How Homeport reaches a Host's Engine API: local sockets, TCP, TLS and SSH (ADR 0001, 0002)"
publish = false

[features]
# Test doubles (a dialer over the local Engine socket) for other crates' tests.
test-support = []

[dependencies]
homeport-core = { workspace = true, features = ["bollard", "russh"] }
bollard.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
russh.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
getrandom.workspace = true
tempfile.workspace = true
uuid.workspace = true
thiserror.workspace = true
log.workspace = true

[package]
name = "homeport-containerd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "containerd Hosts through containerd's gRPC API over the Host's dialer, with commands over SSH for logs and exec (ADR 0020)"
publish = false

[lints]
workspace = true

# The generated API's comments quote Go and filter syntax, not Rust.
[lib]
doctest = false

[dependencies]
# `bollard` for the registry classifier the Docker pull shares (error::engine).
homeport-core = { workspace = true, features = ["bollard"] }
homeport-transport.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
tower.workspace = true
hyper-util.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
shell-words.workspace = true
specta.workspace = true
uuid.workspace = true
log.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tempfile.workspace = true

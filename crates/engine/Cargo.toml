[package]
name = "homeport-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The resources of a Docker Engine (containers, images, volumes, networks…) as plain functions over a bollard client"
publish = false

[lints]
workspace = true

[features]
# Helpers that create (and clean up) throwaway resources on the local Engine.
test-support = []

[dependencies]
homeport-core = { workspace = true, features = ["bollard"] }
bollard.workspace = true
tokio.workspace = true
futures-util.workspace = true
bytes.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tar.workspace = true
shell-words.workspace = true
uuid.workspace = true
gethostname.workspace = true

[dev-dependencies]
homeport-transport = { workspace = true, features = ["test-support"] }
uuid.workspace = true
tempfile.workspace = true

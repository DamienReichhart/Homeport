[package]
name = "homeport-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Homeport desktop application, built on iced"
publish = false

[lints]
workspace = true

# The library holds everything, so tests, examples and the binary share it.
[lib]
name = "homeport_app"
path = "src/lib.rs"

[[bin]]
name = "homeport-iced"
path = "src/main.rs"

# The two galleries (the theme's and the kit's) are developer's tools with
# English literals: they are built for tests and for their examples, never
# into the app.
[features]
gallery = []

[[example]]
name = "gallery"
required-features = ["gallery"]

[[example]]
name = "widgets"
required-features = ["gallery"]

# The app only wires the crates below to iced; their own dependencies
# (bollard, russh, SQLite…) stay theirs.
[dependencies]
homeport-core.workspace = true
homeport-storage.workspace = true
homeport-transport.workspace = true
homeport-engine.workspace = true
homeport-containerd.workspace = true
homeport-incus.workspace = true
homeport-hosts.workspace = true
homeport-clusters.workspace = true
homeport-kubernetes.workspace = true
homeport-nomad.workspace = true
homeport-stacks.workspace = true
homeport-git.workspace = true
homeport-registries.workspace = true
homeport-backup.workspace = true
homeport-settings.workspace = true
homeport-updates.workspace = true
homeport-diagnostics.workspace = true
iced.workspace = true
tokio.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
dirs = "6"
fluent-bundle.workspace = true
fluent-syntax.workspace = true
unic-langid.workspace = true
intl-memoizer.workspace = true
intl_pluralrules.workspace = true
sys-locale.workspace = true
include_dir.workspace = true
icu.workspace = true
icu_experimental.workspace = true
fixed_decimal.workspace = true
writeable.workspace = true
jiff.workspace = true
# The log viewer's search: literal or regular expression, in linear time.
regex.workspace = true
# How many cells a character of a log takes: wide, narrow, or none.
unicode-width.workspace = true
# The platform layer: the OS's file dialogs, and its handler for a link or a folder.
rfd.workspace = true
open.workspace = true

[dev-dependencies]
# A clock the data layer's tests move themselves.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
iced_test.workspace = true
iced_runtime.workspace = true
png.workspace = true
usvg.workspace = true
# Throwaway Engine resources and sample databases, for the use cases' tests.
homeport-storage = { workspace = true, features = ["test-support"] }
homeport-engine = { workspace = true, features = ["test-support"] }
homeport-transport = { workspace = true, features = ["test-support"] }
